name: Windows CI and Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build RimManager.csproj -c Release -warnaserror
      - name: Check tag and release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml]$project = Get-Content RimManager.csproj -Raw
          $version = $project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must match the project version v$version." }
          if (-not (Test-Path "release-notes/$env:GITHUB_REF_NAME.md")) { throw 'Release notes are missing.' }
      - name: Publish Windows x64
        run: dotnet publish RimManager.csproj -c Release -r win-x64 --self-contained true -o artifacts/app
      - name: Package
        shell: pwsh
        run: |
          [xml]$project = Get-Content RimManager.csproj -Raw
          $version = $project.Project.PropertyGroup.Version
          Compress-Archive -Path artifacts/app/* -DestinationPath "artifacts/RimManager-v$version-win-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: RimManager-win-x64
          path: artifacts/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RimManager-win-x64
          path: artifacts
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $asset = "artifacts/RimManager-$tag-win-x64.zip"
          $notes = "release-notes/$tag.md"
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title "RimManager $tag" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset --verify-tag --title "RimManager $tag" --notes-file $notes
          }
          exit $LASTEXITCODE
